name: bananaguard_ai
description: "BananaGuard AI - Research Diagnostic Mobile Application for Banana Defect, Disease & Severity Detection"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4

  # Networking & Storage
  dio: ^5.4.2+1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2

  # Camera & Hardware
  image_picker: ^1.0.8
  permission_handler: ^11.3.1

  # Notifications
  flutter_local_notifications: ^17.1.0
  timezone: ^0.9.2

  # UI & Media
  photo_view: ^0.14.0
  open_filex: ^4.4.0
  share_plus: ^9.0.0
  connectivity_plus: ^5.0.2
  uuid: ^4.3.3
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/App_Icon.jpg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/App_Icon.jpg"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
