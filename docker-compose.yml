version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bananaguard_backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_MODE=demo
      - MODEL_PATH=ml/models/bananaguard_model.keras
      - JWT_SECRET=banana-guard-research-secret-key-32-chars-min!
      - DATABASE_URL=sqlite:////app/storage/bananaguard.db
      - STORAGE_DIR=/app/storage
      - MAX_UPLOAD_MB=10
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://10.0.2.2:8000
      - LOW_CONFIDENCE_THRESHOLD=0.50
    volumes:
      - ./storage:/app/storage
      - ./ml/models:/app/ml/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
